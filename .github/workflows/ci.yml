name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            francoisdcls:
              - 'francoisdcls/**'
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql
      - name: Validate PHP syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 -P4 php -l
      - name: Install composer deps
        run: composer install --no-progress --prefer-dist
      - name: Run phpcs (PSR12)
        if: steps.filter.outputs.francoisdcls == 'true'
        run: vendor/bin/phpcs --standard=francoisdcls/config/phpcs.xml francoisdcls/
      - name: Run tests
        if: steps.filter.outputs.francoisdcls == 'true'
        run: vendor/bin/phpunit --configuration francoisdcls/config/phpunit.xml
