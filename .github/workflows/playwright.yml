name: Playwright E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Start PHP dev server
        run: |
          php -S 127.0.0.1:8080 -t francoisdcls/ > francoisdcls/var/ci_php.log 2>&1 & echo $! > francoisdcls/var/ci_php.pid
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run Playwright tests
        run: npx playwright test --reporter=list
      - name: Stop PHP server
        if: always()
        run: |
          if [ -f francoisdcls/var/ci_php.pid ]; then kill $(cat francoisdcls/var/ci_php.pid) || true; fi
