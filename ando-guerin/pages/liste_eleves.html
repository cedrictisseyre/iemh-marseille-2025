<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des élèves</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="../index.php">IHME</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="liste_jours.html">Jours</a></li>
        <li class="nav-item"><a class="nav-link" href="liste_horaires.html">Horaires</a></li>
        <li class="nav-item"><a class="nav-link" href="liste_matieres.html">Matières</a></li>
        <li class="nav-item"><a class="nav-link" href="liste_professeurs.html">Professeurs</a></li>
        <li class="nav-item"><a class="nav-link" href="liste_salles.html">Salles</a></li>
        <li class="nav-item"><a class="nav-link" href="liste_emploi_temps.html">Emploi du temps</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container mt-4">
  <h2>Liste des élèves</h2>
  <form id="form-eleve" class="mb-4">
    <div class="row g-2">
      <div class="col-md-4"><input type="text" class="form-control" name="prenom" placeholder="Prénom" required></div>
      <div class="col-md-4"><input type="text" class="form-control" name="nom" placeholder="Nom" required></div>
      <div class="col-md-4"><button type="submit" class="btn btn-success w-100">Ajouter élève</button></div>
    </div>
    <div id="eleve-message" class="mt-2"></div>
  </form>
  <ul id="eleves-list" class="list-group"></ul>
  <a href="../index.php" class="btn btn-secondary mt-3">Retour accueil</a>
</div>
<script>
document.getElementById('form-eleve').onsubmit = function(e) {
  e.preventDefault();
  const form = e.target;
  const data = new FormData(form);
  fetch('../services/ajouter_eleve.php', {
    method: 'POST',
    body: data
  })
  .then(r => r.text())
  .then(msg => {
    document.getElementById('eleve-message').textContent = msg;
    form.reset();
    // Rafraîchir la liste
    fetch('../services/lire_eleves.php')
      .then(r => r.json())
      .then(data => {
        const ul = document.getElementById('eleves-list');
        ul.innerHTML = '';
        data.forEach(eleve => {
          const li = document.createElement('li');
          li.className = 'list-group-item';
          li.textContent = eleve.prenom + ' ' + eleve.nom;
          ul.appendChild(li);
        });
      });
  });
};
fetch('../services/lire_eleves.php')
  .then(r => r.json())
  .then(data => {
    const ul = document.getElementById('eleves-list');
    data.forEach(eleve => {
      const li = document.createElement('li');
      li.className = 'list-group-item';
      li.textContent = eleve.prenom + ' ' + eleve.nom;
      ul.appendChild(li);
    });
  });
</script>
</body>
</html>
